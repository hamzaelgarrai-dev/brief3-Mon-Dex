          <input id="search" type="search" placeholder="ex. Mossling" class="field text-white bg-[#253348] border border-[#303947] font-normal">
        </label>
      </div>
      <div id="filters" role="group" aria-label="Filtrer par type" class="flex h-auto flex-wrap gap-2 ">
          <button type="button" class="type chip bg-brand text-white border border-[#303947] shrink-0">All</button>

    <!-- ===================== FORMULAIRE DE CRÉATION ===================== -->
    <section id="create" aria-label="Nouvelle créature" class="flex flex-col gap-6 rounded-card bg-[#171E29] border border-[#303947] p-8 h-auto">
      <div>
        <h2 class="font-display text-3xl font-extrabold">New Card</h2>
        <p class="text-muted">Chaque champ est vérifié avant l'ajout de la créature.</p>
      </div>
      <form id="creature-form" novalidate class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-4">
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Numéro
          <input name="id" type="text" placeholder="#010" class="field bg-[#11151D] text-white font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Nom
          <input name="name" type="text" placeholder="Nom de la créature" class="field bg-[#11151D] text-white font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Type
          <select name="type" class="field font-normal bg-[#11151D] text-white">
            <option value="">Choisir un type</option>
            <option>Feu</option><option>Eau</option><option>Plante</option>
            <option>Électrik</option><option>Glace</option><option>Ténèbres</option>
          </select>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Niveau
          <input name="level" type="text" placeholder="Base, Niveau 1…" class="field bg-[#11151D] text-white font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Statistique 1
          <input name="stat1" type="text" placeholder="0 à 999" class="field bg-[#11151D] text-white font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Statistique 2
          <input name="stat2" type="text" placeholder="0 à 999" class="field bg-[#11151D] text-white font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Statistique 3
          <input name="stat3" type="text" placeholder="0 à 999" class="field bg-[#11151D] text-white font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold text-[#F3F4F6]">Lien de l'image
          <input name="image" type="text" placeholder="https://…/image.png" class="field font-normal bg-[#11151D] text-white">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold md:col-span-2 lg:col-span-4 text-[#F3F4F6]">Description
          <textarea name="description" rows="3" placeholder="10 à 200 caractères" class="field h-auto bg-[#11151D] text-white rounded-xl  p-3 font-normal "></textarea>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <div class="flex flex-wrap justify-end gap-3 md:col-span-2 lg:col-span-4">
          <button type="reset" class="btn-outline px-6">Effacer</button>
          <button type="submit" class="btn-primary">Create Card</button>
        </div>
      </form>
    </section>
